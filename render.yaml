# One-click deploy blueprint for Render (https://render.com).
# In Render: New → Blueprint → connect this repo. Render reads this file.
services:
  - type: web
    name: family-calendar
    runtime: node
    plan: starter # has a persistent disk; the free plan does not persist data
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/family.sqlite
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: INVITE_CODE
        sync: false # set your own in the dashboard (optional)
      - key: FEED_REFRESH_MINUTES
        value: "30"
      # ---- Weekly email digest (optional; fill these in the dashboard) ----
      - key: TIMEZONE
        value: America/New_York
      - key: APP_URL
        sync: false # e.g. https://family-calendar.onrender.com
      - key: DIGEST_CRON
        value: "0 7 * * 0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: family-data
      mountPath: /data
      sizeGB: 1
